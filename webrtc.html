<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="media/img/favicon.ico" type="image/x-icon">
  <title>Q-Trailer — Quiz Multijugador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="webrtc.css">
</head>

<body>
  <header class="px-3 px-md-4 py-2">
    <img src="media/img/icon.svg" alt="Q-Trailer">
    <ul class="mb-0">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/webrtc" class="active">WebRTC</a></li>
    </ul>
  </header>

  <main class="py-4">
    <div class="container-fluid px-3 px-md-4">

      <!-- PANTALLA: Unirse -->
      <div id="screen-join" class="rtc-screen rtc-center">
        <div class="rtc-join-card">
          <h1>Quiz Multijugador</h1>
          <p class="rtc-subtitle">El primero en entrar controla el vídeo. Todos juegan.</p>
          <div class="mb-3">
            <label class="form-label">Tu nombre</label>
            <input type="text" id="input-name" class="form-control rtc-input" maxlength="20">
          </div>
          <div class="mb-4">
            <label class="form-label">Código de sala</label>
            <input type="text" id="input-room" class="form-control rtc-input" placeholder="Ej: SALA1" maxlength="10">
          </div>
          <button id="btn-join" class="btn rtc-btn-primary w-100">Entrar</button>
          <p id="join-error" class="rtc-error mt-2" style="display:none"></p>
        </div>
      </div>

      <!-- PANTALLA: Juego (todos) -->
      <div id="screen-game" class="rtc-screen" style="display:none">
        <div class="row g-3">

          <!-- Columna vídeo -->
          <div class="col-12 col-lg-8">
            <div class="rtc-panel">

              <!-- Header sala -->
              <div class="rtc-panel-header mb-2">
                <span>Sala: <strong id="game-room-code"></strong></span>
                <div class="d-flex gap-2 align-items-center">
                  <span id="badge-host" class="rtc-badge-host" style="display:none">HOST</span>
                  <button id="btn-end-quiz" class="btn rtc-btn-danger btn-sm" style="display:none">
                    Terminar quiz
                  </button>
                </div>
              </div>

              <!-- Player -->
              <figure id="game-player-container" class="mb-0 position-relative">
                <video id="game-video" preload="metadata" playsinline></video>

                <!-- Controles (host: activos / no-host: desactivados visualmente) -->
                <div id="game-controls" class="controls" data-state="hidden">
                  <div id="game-progress-bar" class="progress-bar-wrap">
                    <div id="game-progress-buffer"></div>
                    <div id="game-progress-fill"></div>
                  </div>
                  <button id="game-play-btn">▶</button>
                  <span id="game-time-display">0:00 / 0:00</span>
                  <div class="spacer"></div>
                  <button id="game-fs-btn">⛶</button>
                </div>

                <!-- Overlay pregunta (aparece para TODOS) -->
                <div id="question-overlay" class="game-overlay" style="display:none">
                  <div class="game-overlay-inner">
                    <p id="overlay-movie" class="overlay-movie"></p>
                    <p id="overlay-question" class="overlay-question"></p>
                    <div id="overlay-countdown" class="overlay-countdown">20</div>
                    <div id="overlay-options" class="overlay-options"></div>
                    <div id="overlay-feedback" class="overlay-feedback" style="display:none"></div>
                  </div>
                </div>
              </figure>

            </div>
          </div>

          <!-- Columna lateral -->
          <div class="col-12 col-lg-4">
            <div class="rtc-panel">
              <p class="rtc-panel-title">Clasificación</p>
              <div id="scoreboard"></div>
            </div>
            <div class="rtc-panel mt-3" id="funfacts-panel" style="display:none">
              <p class="rtc-panel-title">Fun Facts</p>
              <div id="funfacts-list"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- PANTALLA: Final -->
      <div id="screen-end" class="rtc-screen rtc-center" style="display:none">
        <div class="rtc-end-card">
          <h2>¡Quiz terminado!</h2>
          <div id="end-podium" class="rtc-podium"></div>
          <div id="end-scores" class="mt-4"></div>
          <button id="btn-play-again" class="btn rtc-btn-primary mt-4">Volver a la sala</button>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>Practica GDIE Jaume &amp; Pau Curso 2025-26</p>
  </footer>

  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="webrtc.js"></script>
</body>

</html>
