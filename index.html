<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="media/img/favicon.ico" type="image/x-icon">
  <title>Q-Trailer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" media="screen" href="style.css">
</head>

<body>
  <header class="px-3 px-md-4 py-2">
    <img src="media/img/icon.svg" alt="Q-Trailer">
    <ul class="mb-0">
      <li><a href="/index.html">Home</a></li>
      <li><a href="#">WebRTC</a></li>
    </ul>
  </header>

  <main class="py-4">
    <div id="content" class="container">
      <div id="top-container" class="row g-3 align-items-start">
        <div class="col-12 col-lg-8 panel-stack">
          <figure id="player-container" class="mb-0">
            <video id="main-video" preload="metadata" poster="media/img/preview.jpg" playsinline>
              <source src="media/video/video.webm" type="video/webm">
              <source src="media/video/video.mp4" type="video/mp4">
              <track src="media/chapters.vtt" kind="chapters" srclang="en" label="Chapters" default>
              <track src="media/info.vtt" kind="metadata" srclang="en" label="Info">
              <p>Error cargando video, el navegador no lo soporta.</p>
            </video>

            <div id="video-controls" class="controls" data-state="hidden">
              <div id="progress-bar">
                <div id="progress-buffer"></div>
                <div id="progress-fill"></div>
              </div>

              <button id="play-button">▶</button>
              <button id="reset-button">⏹</button>
              <button id="seek-backward-button">⏪ 15s</button>
              <button id="seek-forward-button">15s ⏩</button>

              <span id="time-display">0:00 / 0:00</span>

              <select id="chapters-select">
                <option value="">Chapters</option>
              </select>

              <div id="volume-container">
                <button id="mute-button">🔊</button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
              </div>

              <select id="resolution-select">
                <option value="">Auto</option>
                <option value="360">360p</option>
                <option value="720">720p</option>
                <option value="4k">2160p</option>
              </select>

              <div class="spacer"></div>
              <button id="fullscreen-button">⛶</button>
            </div>
          </figure>

          <figure id="actors-info" class="container-panel">
            <figcaption>Actores</figcaption>
            <div class="actors-grid">
            </div>
          </figure>

          <figure id="related-movies" class="container-panel">
            <figcaption>Peliculas similares</figcaption>
            <div>
              <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp"
                alt="Poster pelicula relacionada">
              <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp"
                alt="Poster pelicula relacionada">
              <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp"
                alt="Poster pelicula relacionada">
            </div>
          </figure>

          <figure id="synopsis" class="container-panel">
            <figcaption>Sinopsis</figcaption>
            <p>Selecciona un capitulo para ver su sinopsis.</p>
          </figure>
        </div>

        <div class="col-12 col-lg-4 top-info-col">
          <div class="info-stack">
            <div id="location" class="container-panel">Wikipedia</div>
            <div id="filming-map" class="container-panel">Mapa de rodaje</div>
            <div id="description" class="container-panel">Location</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Practica GDIE Jaume & Pau Curso 2025-26</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>

</html>
