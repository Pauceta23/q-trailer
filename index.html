<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Trailer</title>
  <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
  <script src='script.js'></script>
</head>
<body>
  <header>
    <img src="media/img/icon.svg">
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li>WebRTC</li>
    </ul>
  </header>
  <main>
    <figure id="playerContainer">
      <video id="main-video" preload="metadata" poster="media/img/preview.jpg" playsinline>
        <source src="video.webm" type="video/webm; codecs='vp9, opus'">
        <source src="video.mp4" type="video/mp4; codecs='avc1.42E01E, mp4a.40.2'">
        <p>Error cargando video, el navegador no lo soporta.</p>
     </video>
      <!-- Interfaz de controles personalizada -->
      <div id="video-controls" class="controls">
        <!-- Botones y sliders definidos aquí -->
        <button id="play-button">Play</button>
        <button id="reset-button">Reset</button>
        <button id="seek-backward-button">Seek bw</button>
        <button id="seek-forward-button">Seek fw</button>
        <button id="mute-button">Mute</button>
        <div id="progress-bar">Progress bar</div>
        <button id="settings-button">Settings</button>
        <button id="fullscreen-button">Fullscreen</button>
      </div>
    </figure>
  </main>
  <footer>
    <p>Práctica GDIE Jaume & Pau Curso 2025-26</p>
  </footer>
</body>
</html>
