<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Trailer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" media="screen" href="style.css">
</head>
<body>
  <header class="px-3 px-md-4 py-2">
    <img src="media/img/icon.svg" alt="Q-Trailer">
    <ul class="mb-0">
      <li><a href="/index.html">Home</a></li>
      <li><a href="#">WebRTC</a></li>
    </ul>
  </header>

  <main class="py-4">
    <div id="content" class="container">
      <div id="top-container" class="row g-3 align-items-start">
        <figure id="player-container" class="col-12 col-lg-8 mb-0">
          <video id="main-video" preload="metadata" poster="media/img/preview.jpg" playsinline>
            <source src="media/video/video.webm" type="video/webm; codecs='vp9, opus'">
            <source src="media/video/video.mp4" type="video/mp4; codecs='avc1.42E01E, mp4a.40.2'">
            <p>Error cargando video, el navegador no lo soporta.</p>
          </video>
          <div id="video-controls" class="controls">
            <button id="play-button">Play</button>
            <button id="reset-button">Reset</button>
            <button id="seek-backward-button">Seek bw</button>
            <button id="seek-forward-button">Seek fw</button>
            <button id="mute-button">Mute</button>
            <div id="progress-bar">Progress bar</div>
            <button id="settings-button">Settings</button>
            <button id="fullscreen-button">Fullscreen</button>
          </div>
        </figure>

        <div class="col-12 col-lg-4">
          <div id="location" class="container-panel mb-3">Wikipedia</div>
          <div id="description" class="container-panel">Location</div>
        </div>
      </div>

      <div id="bottom-container" class="row g-3 mt-1">
        <figure id="related-movies" class="container-panel col-12 col-xl-8 mb-0">
          <figcaption>Peliculas parecidas</figcaption>
          <div>
            <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp" alt="Poster pelicula relacionada">
            <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp" alt="Poster pelicula relacionada">
            <img class="related-movie" src="media/img/start-wars-the-force-awakens.webp" alt="Poster pelicula relacionada">
          </div>
        </figure>

        <figure id="actors-info" class="container-panel col-12 col-xl-4 mb-0">
          <div class="actor">
            <img src="media/img/harrison-ford.jpg" alt="Harrison Ford">
            <p>Harrison Ford</p>
          </div>
          <div class="actor">
            <img src="media/img/harrison-ford.jpg" alt="Harrison Ford">
            <p>Harrison Ford</p>
          </div>
          <div class="actor">
            <img src="media/img/harrison-ford.jpg" alt="Harrison Ford">
            <p>Harrison Ford</p>
          </div>
        </figure>
      </div>
    </div>
  </main>

  <footer>
    <p>Practica GDIE Jaume & Pau Curso 2025-26</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
